name: TPAC Continuous Conformance

on:
  push:
    paths:
      - 'TPAC/**'
      - 'tests/**'
      - '.github/workflows/tpac-conformance.yml'
  pull_request:
    paths:
      - 'TPAC/**'
      - 'tests/**'
      - '.github/workflows/tpac-conformance.yml'
  workflow_dispatch:

jobs:
  tpac-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Run TPAC integration and replay tests
        run: python -m pytest -q tests/test_tpac_integration.py tests/test_tpac_replay.py

      - name: Run full test suite
        run: python -m pytest -q
