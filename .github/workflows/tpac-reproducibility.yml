name: TPAC Operating-System Reproducibility

on:
  push:
    paths:
      - 'TPAC/**'
      - 'tests/**'
      - '.github/workflows/tpac-reproducibility.yml'
  pull_request:
    paths:
      - 'TPAC/**'
      - 'tests/**'
      - '.github/workflows/tpac-reproducibility.yml'
  workflow_dispatch:

jobs:
  reproducibility:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run TPAC reproducibility tests
        run: python -m pytest -q tests/test_tpac_reproducibility.py

      - name: Generate environment manifest
        run: python TPAC/reference/environment_manifest.py

      - name: Upload environment manifest
        uses: actions/upload-artifact@v4
        with:
          name: tpac-environment-${{ matrix.os }}
          path: tpac-environment-manifest.json
