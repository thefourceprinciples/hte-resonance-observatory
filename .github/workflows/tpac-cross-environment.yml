name: TPAC Cross-Environment Reproducibility

on:
  push:
    paths:
      - 'TPAC/**'
      - 'tests/**'
      - '.github/workflows/tpac-cross-environment.yml'
  pull_request:
    paths:
      - 'TPAC/**'
      - 'tests/**'
      - '.github/workflows/tpac-cross-environment.yml'
  workflow_dispatch:

jobs:
  experiment:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e .

      - name: Run reproducibility tests
        run: python -m pytest -q tests/test_tpac_reproducibility.py tests/test_tpac_experiment.py

      - name: Generate TPAC evidence manifest
        run: python -m TPAC.reference.conformance_report

      - name: Upload environment manifest
        uses: actions/upload-artifact@v4
        with:
          name: tpac-manifest-python-${{ matrix.python-version }}
          path: tpac-experiment-manifest.json
          if-no-files-found: error

  compare:
    name: Compare cross-environment manifests
    needs: experiment
    runs-on: ubuntu-latest
    steps:
      - name: Download manifests
        uses: actions/download-artifact@v4
        with:
          pattern: tpac-manifest-python-*
          path: manifests
          merge-multiple: false

      - name: Compare deterministic fields
        shell: python
        run: |
          import glob
          import json
          import sys

          paths = sorted(glob.glob("manifests/**/tpac-experiment-manifest.json", recursive=True))
          if len(paths) < 2:
              raise SystemExit("expected manifests from at least two Python environments")

          manifests = [json.load(open(path, encoding="utf-8")) for path in paths]
          fields = ["configuration_hash", "input_hash", "event_log_hash", "conformance_verdict"]
          baseline = {field: manifests[0][field] for field in fields}

          for path, manifest in zip(paths, manifests):
              current = {field: manifest[field] for field in fields}
              if current != baseline:
                  print("DIVERGENCE:", path)
                  print("baseline:", baseline)
                  print("current:", current)
                  sys.exit(1)

          print(f"Cross-environment reproducibility PASS across {len(manifests)} environments")
          print(baseline)
